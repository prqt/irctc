<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>IRCTC</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="notch" aria-label="IRCTC header notch">
        <img
          src="https://www.irctc.co.in/eticket/assets-new/header.svg"
          alt="IRCTC and Indian Railways logos"
          class="notch-logo"
        />
      </header>

      <section class="hero-grid" aria-label="Initial IRCTC booking layout">
        <div class="train-face" aria-hidden="true">
          <div class="train-window-row">
            <span></span><span></span><span></span><span></span>
          </div>
          <div class="seat-grid">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
          </div>
        </div>

        <article class="booking-card">
          <p class="eyebrow">IRCTC</p>
          <h1>Book Tickets</h1>
          <p class="setup-note">Apple-inspired dark booking workspace, ready for Supabase authentication and database wiring.</p>
        </article>
      </section>
    </main>
  </body>
</html>
